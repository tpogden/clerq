project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - installation.qmd
    - usage/*.ipynb
    - usage/scripts.md
    - examples/index.qmd
    - examples/*.ipynb
    - "!examples/mbs-ladder-rydberg-eit-counter.ipynb"  # draft
    - support/troubleshooting.md

execute:
  freeze: auto
  cache: true

website:
  title: "clerq"
  description: "Differentiable Maxwell–Lindblad solver for near-resonant light propagation"
  site-url: https://clerq.org
  repo-url: https://github.com/tpogden/clerq
  repo-actions: [edit, issue]
  navbar:
    left:
      - {href: index.qmd, text: Home}
      - {href: installation.qmd, text: Install}
      - {href: usage/two-level.ipynb, text: Usage}
      - {href: examples/index.qmd, text: Examples}
      - {href: support/troubleshooting.md, text: Support}
  sidebar:
    style: docked
    contents:
      - installation.qmd
      - section: "Usage"
        contents:
          - usage/two-level.ipynb
          - usage/three-level.ipynb
          - usage/structure.ipynb
          - usage/spectral-analysis.ipynb
          - usage/velocity-classes.ipynb
          - usage/counter-propagating.ipynb
          - usage/plotting.ipynb
          - usage/built-in-time-functions.ipynb
          - usage/scripts.md
      - section: "Examples"
        href: examples/index.qmd
        contents:
          - examples/mbs-linear-absorption.ipynb
          - examples/mbs-sit-area-theorem.ipynb
          - examples/mbs-two-photon-echo.ipynb
          - examples/mbs-lambda-eit-slow-light.ipynb
          - examples/mbs-lambda-cpt.ipynb
          - examples/mbs-lambda-adiabatons.ipynb
          - examples/mbs-vee-simultons.ipynb
          - examples/mbs-ladder-weak-pulse-coupling-decay.ipynb
          - examples/mbs-ladder-autler-townes.ipynb
          - examples/mbs-Rb87_5s12_5p12_F11_q1-weak-pulse-decay.ipynb
          - examples/mbs-Rb87_5s12_5p12_F11_q1-sech-2pi.ipynb
          - examples/mbs-Rb87_5s12_5p32_F23_q1-weak-pulse-decay.ipynb
      - support/troubleshooting.md

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
